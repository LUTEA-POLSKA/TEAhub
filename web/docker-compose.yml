version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-teahub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teahub}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-teahub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-teahub}
      - TEAHUB_PUBLIC_ORIGIN=${TEAHUB_PUBLIC_ORIGIN}
      - TEAHUB_PROVIDERS=${TEAHUB_PROVIDERS}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - MLHSM_BASE_URL=${MLHSM_BASE_URL}
      - MLHSM_API_KEY=${MLHSM_API_KEY}
      - TEAHUB_WORKSPACE_ROOTS=${TEAHUB_WORKSPACE_ROOTS:-/workspace}
      - TEAHUB_FETCH_HOSTS=${TEAHUB_FETCH_HOSTS}
      - TEAHUB_POLICY_PATH=${TEAHUB_POLICY_PATH:-policy.json}
      - TEAHUB_SESSION_TTL_MS=${TEAHUB_SESSION_TTL_MS}
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-teahub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-teahub}
      - TEAHUB_PUBLIC_ORIGIN=${TEAHUB_PUBLIC_ORIGIN}
      - TEAHUB_PROVIDERS=${TEAHUB_PROVIDERS}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - MLHSM_BASE_URL=${MLHSM_BASE_URL}
      - MLHSM_API_KEY=${MLHSM_API_KEY}
      - TEAHUB_WORKSPACE_ROOTS=${TEAHUB_WORKSPACE_ROOTS:-/workspace}
      - TEAHUB_FETCH_HOSTS=${TEAHUB_FETCH_HOSTS}
      - TEAHUB_POLICY_PATH=${TEAHUB_POLICY_PATH:-policy.json}
      - TEAHUB_SESSION_TTL_MS=${TEAHUB_SESSION_TTL_MS}
      - WORKER_INTERVAL_MS=${WORKER_INTERVAL_MS:-1000}
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    restart: unless-stopped

volumes:
  postgres_data: